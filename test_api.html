<!DOCTYPE html>
<html>
<head>
    <title>Test API</title>
</head>
<body>
    <h1>Test API Connection</h1>
    <button onclick="testAPI()">Test API</button>
    <div id="result"></div>

    <script>
        async function testAPI() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Đang test...';
            
            try {
                const response = await fetch('/api/get_latest_location?deviceId=SmartCane01', { 
                    cache: 'no-store' 
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                resultDiv.innerHTML = `
                    <h3>API Response:</h3>
                    <p><strong>Latitude:</strong> ${data.latitude}</p>
                    <p><strong>Longitude:</strong> ${data.longitude}</p>
                    <p><strong>Time:</strong> ${data.time_local}</p>
                    <p><strong>Date:</strong> ${data.date_local}</p>
                    <p><strong>Timestamp:</strong> ${data.timestamp_server}</p>
                `;
            } catch (error) {
                resultDiv.innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
            }
        }
        
        // Auto test every 10 seconds
        setInterval(testAPI, 10000);
        
        // Test immediately
        testAPI();
    </script>
</body>
</html>
