<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="login.title">??ng Nh?p</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --primary-light: #60a5fa;
            --gradient-1: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --gradient-2: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            --gradient-3: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%);
            --success: #10b981;
            --error: #ef4444;
            --text-dark: #1f2937;
            --text-light: #6b7280;
            --bg-light: #f9fafb;
            --white: #ffffff;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.07);
            --shadow-lg: 0 10px 15px rgba(0, 0, 0, 0.1);
            --shadow-xl: 0 20px 25px rgba(0, 0, 0, 0.15);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--gradient-3);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            position: relative;
            overflow: hidden;
        }

        /* Animated Background */
        body::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: moveBackground 20s linear infinite;
            pointer-events: none;
        }

        @keyframes moveBackground {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        .login-wrapper {
            display: flex;
            max-width: 1100px;
            width: 100%;
            background: var(--white);
            border-radius: 24px;
            box-shadow: var(--shadow-xl);
            overflow: hidden;
            position: relative;
            z-index: 1;
        }

        /* Left Panel - Branding */
        .login-brand {
            flex: 1;
            background: var(--gradient-2);
            padding: 3rem;
            color: var(--white);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .login-brand::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            top: -100px;
            right: -100px;
        }

        .login-brand::after {
            content: '';
            position: absolute;
            width: 200px;
            height: 200px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            bottom: -50px;
            left: -50px;
        }

        .brand-content {
            position: relative;
            z-index: 1;
        }

        .brand-icon {
            font-size: 4rem;
            margin-bottom: 1.5rem;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .brand-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            line-height: 1.2;
        }

        .brand-subtitle {
            font-size: 1.125rem;
            opacity: 0.95;
            margin-bottom: 2rem;
        }

        .brand-features {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-top: 2rem;
            text-align: left;
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 0.95rem;
        }

        .feature-icon {
            width: 32px;
            height: 32px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Right Panel - Login Form */
        .login-container {
            flex: 1;
            padding: 3rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .login-header {
            margin-bottom: 2rem;
        }

        .login-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 0.5rem;
        }

        .login-description {
            color: var(--text-light);
            font-size: 0.95rem;
        }

        /* Language Switcher */
        .language-switcher {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .lang-btn {
            padding: 0.5rem 1rem;
            border: 2px solid #e5e7eb;
            background: transparent;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-light);
            cursor: pointer;
            transition: all 0.2s;
        }

        .lang-btn.active {
            border-color: var(--primary);
            background: var(--primary);
            color: var(--white);
        }

        .lang-btn:hover:not(.active) {
            border-color: var(--primary-light);
            color: var(--primary);
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form-label {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-dark);
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
            pointer-events: none;
        }

        .form-input {
            width: 100%;
            padding: 0.875rem 1rem 0.875rem 3rem;
            font-size: 1rem;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        .form-input::placeholder {
            color: #9ca3af;
        }

        .login-button {
            width: 100%;
            padding: 1rem;
            background: var(--gradient-2);
            color: var(--white);
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .login-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3);
        }

        .login-button:active {
            transform: translateY(0);
        }

        .login-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            background: #fee2e2;
            color: #991b1b;
            padding: 1rem;
            border-radius: 12px;
            font-size: 0.875rem;
            display: none;
            align-items: center;
            gap: 0.5rem;
        }

        .error-message.show {
            display: flex;
        }

        .demo-credentials {
            background: var(--bg-light);
            padding: 1rem;
            border-radius: 12px;
            margin-top: 1.5rem;
            border-left: 4px solid var(--primary);
        }

        .demo-credentials strong {
            color: var(--primary-dark);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.75rem;
            font-size: 0.875rem;
        }

        .demo-info {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            font-size: 0.875rem;
            color: var(--text-light);
        }

        .demo-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .demo-item code {
            background: var(--white);
            padding: 0.25rem 0.75rem;
            border-radius: 6px;
            font-family: 'Monaco', monospace;
            font-size: 0.875rem;
            color: var(--text-dark);
            border: 1px solid #e5e7eb;
        }

        .login-footer {
            text-align: center;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid #e5e7eb;
            font-size: 0.875rem;
            color: var(--text-light);
        }

        /* Responsive Design */
        @media (max-width: 968px) {
            .login-brand {
                display: none;
            }

            .login-container {
                padding: 2rem;
            }
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 1.5rem;
            }

            .brand-title {
                font-size: 2rem;
            }

            .login-title {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <!-- Left Panel - Branding -->
        <div class="login-brand">
            <div class="brand-content">
                <div class="brand-icon">
                    <i class="fas fa-walking"></i>
                </div>
                <h1 class="brand-title" data-i18n="app.title">G?y Th?ng Minh GPS</h1>
                <p class="brand-subtitle" data-i18n="app.subtitle">H? Th?ng Gi?m S?t GPS Th?i Gian Th?c</p>
                
                <div class="brand-features">
                    <div class="feature-item">
                        <div class="feature-icon"><i class="fas fa-shield-alt"></i></div>
                        <span data-i18n="feature.secure">An to?n & b?o m?t cao</span>
                    </div>
                    <div class="feature-item">
                        <div class="feature-icon"><i class="fas fa-map-marked-alt"></i></div>
                        <span data-i18n="feature.realtime">Gi?m s?t th?i gian th?c</span>
                    </div>
                    <div class="feature-item">
                        <div class="feature-icon"><i class="fas fa-chart-line"></i></div>
                        <span data-i18n="feature.analytics">Ph?n t?ch th?ng minh</span>
                    </div>
                    <div class="feature-item">
                        <div class="feature-icon"><i class="fas fa-mobile-alt"></i></div>
                        <span data-i18n="feature.responsive">T??ng th?ch m?i thi?t b?</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Panel - Login Form -->
        <div class="login-container">
            <div class="login-header">
                <h2 class="login-title" data-i18n="login.title">??ng Nh?p</h2>
                <p class="login-description" data-i18n="login.subtitle">H? Th?ng Gi?m S?t GPS An To?n</p>
            </div>

            <!-- Language Switcher -->
            <div class="language-switcher">
                <button class="lang-btn active" onclick="changeLanguage('vi')" id="lang-vi">
                    ???? Ti?ng Vi?t
                </button>
                <button class="lang-btn" onclick="changeLanguage('en')" id="lang-en">
                    ???? English
                </button>
            </div>

            <form class="login-form" onsubmit="handleLogin(event)">
                <div id="error-message" class="error-message">
                    <i class="fas fa-exclamation-circle"></i>
                    <span id="error-text"></span>
                </div>

                <div class="form-group">
                    <label class="form-label" for="username" data-i18n="login.username">T?n ??ng nh?p</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user input-icon"></i>
                        <input 
                            type="text" 
                            id="username" 
                            name="username" 
                            class="form-input" 
                            data-i18n-placeholder="login.username.placeholder"
                            placeholder="Nh?p t?n ??ng nh?p"
                            required
                            autocomplete="username"
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password" data-i18n="login.password">M?t kh?u</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock input-icon"></i>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            class="form-input" 
                            data-i18n-placeholder="login.password.placeholder"
                            placeholder="Nh?p m?t kh?u"
                            required
                            autocomplete="current-password"
                        >
                    </div>
                </div>

                <button type="submit" class="login-button" id="login-btn">
                    <i class="fas fa-sign-in-alt"></i>
                    <span data-i18n="login.button">??ng Nh?p</span>
                </button>

                <div class="demo-credentials">
                    <strong>
                        <i class="fas fa-key"></i>
                        <span data-i18n="login.demo.title">T?i Kho?n Demo</span>
                    </strong>
                    <div class="demo-info">
                        <div class="demo-item">
                            <span data-i18n="login.demo.username">T?n ??ng nh?p</span>
                            <code>admin</code>
                        </div>
                        <div class="demo-item">
                            <span data-i18n="login.demo.password">M?t kh?u</span>
                            <code>admin123</code>
                        </div>
                    </div>
                </div>
            </form>

            <div class="login-footer">
                <span data-i18n="login.footer">G?y Th?ng Minh GPS v2.0 ? An To?n & Hi?n ??i</span>
            </div>
        </div>
    </div>

    <!-- Load i18n first -->
    <script src="/static/js/i18n.js"></script>
    
    <script>
        // Initialize language
        const savedLang = i18n.getLanguage();
        document.documentElement.lang = savedLang;
        
        // Update active language button
        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.classList.remove('active');
        });
        document.getElementById(`lang-${savedLang}`).classList.add('active');
        
        // Apply translations
        i18n.updatePageTranslations();
        
        // Add missing translations for brand features
        const featureTranslations = {
            vi: {
                'feature.secure': 'An to?n & b?o m?t cao',
                'feature.realtime': 'Gi?m s?t th?i gian th?c',
                'feature.analytics': 'Ph?n t?ch th?ng minh',
                'feature.responsive': 'T??ng th?ch m?i thi?t b?'
            },
            en: {
                'feature.secure': 'Secure & Protected',
                'feature.realtime': 'Real-time Monitoring',
                'feature.analytics': 'Smart Analytics',
                'feature.responsive': 'Cross-device Compatible'
            }
        };
        
        // Update feature translations
        document.querySelectorAll('[data-i18n^="feature."]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            el.textContent = featureTranslations[savedLang][key] || el.textContent;
        });
        
        function changeLanguage(lang) {
            i18n.setLanguage(lang);
            document.documentElement.lang = lang;
            
            // Update active button
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.getElementById(`lang-${lang}`).classList.add('active');
            
            // Update feature translations
            document.querySelectorAll('[data-i18n^="feature."]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                el.textContent = featureTranslations[lang][key] || el.textContent;
            });
        }
        
        async function handleLogin(event) {
            event.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('login-btn');
            const errorMsg = document.getElementById('error-message');
            const errorText = document.getElementById('error-text');
            
            // Hide error message
            errorMsg.classList.remove('show');
            
            // Disable button
            loginBtn.disabled = true;
            const btnText = loginBtn.querySelector('span');
            btnText.textContent = i18n.t('login.logging_in');
            
            try {
                const response = await fetch('/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    // Save token to localStorage
                    localStorage.setItem('access_token', data.access_token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    
                    // Redirect to map
                    window.location.href = '/map';
                } else {
                    // Show error
                    errorText.textContent = data.detail || i18n.t('login.error.default');
                    errorMsg.classList.add('show');
                }
            } catch (error) {
                errorText.textContent = i18n.t('login.error.network');
                errorMsg.classList.add('show');
            } finally {
                // Re-enable button
                loginBtn.disabled = false;
                btnText.textContent = i18n.t('login.button');
            }
        }
        
        // Check if already logged in
        if (localStorage.getItem('access_token')) {
            window.location.href = '/map';
        }
    </script>
</body>
</html>
