<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng điều khiển | Theo dõi Gậy thông minh</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* --- Reset & Basic Setup --- */
        :root {
            --background-main: #f4f7fa; /* Light grey background */
            --background-card: #ffffff; /* White for cards */
            --text-primary: #1a202c;    /* Dark charcoal for text */
            --text-secondary: #5a6474;  /* Lighter grey for secondary text */
            --border-color: #e2e8f0;   /* Subtle border color */
            --accent-color: #3b82f6;   /* A modern, friendly blue */
            --accent-color-dark: #2563eb;
            --status-online: #10b981;  /* Green for online status */
            --status-error: #ef4444;   /* Red for error status */
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--background-main);
            color: var(--text-primary);
            line-height: 1.6;
            padding: 2rem;
        }

        /* --- Main Layout & Container --- */
        .container {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 380px 1fr;
            grid-template-rows: auto 1fr;
            gap: 2rem;
            grid-template-areas:
                "header header"
                "info-panel map-panel";
        }
        header {
            grid-area: header;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
        }
        header h1 {
            font-size: 2.25rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        /* --- Panels (Cards) --- */
        .info-panel, .map-panel {
            background: var(--background-card);
            border-radius: 12px;
            box-shadow: var(--shadow);
            padding: 2rem;
            display: flex;
            flex-direction: column;
        }
        .info-panel { grid-area: info-panel; }
        .map-panel { grid-area: map-panel; padding: 0; overflow: hidden; }

        /* --- Info Panel Styling --- */
        .info-panel h2 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .status-wrapper {
            display: flex; align-items: center; gap: 0.75rem;
            font-size: 0.9rem; font-weight: 500; color: var(--text-secondary);
        }
        #status-indicator {
            width: 12px; height: 12px; border-radius: 50%;
            background: #cbd5e1; /* Default: offline */
            transition: background-color .3s ease;
            box-shadow: 0 0 8px 0 rgba(0,0,0,0.1);
        }
        #status-indicator.online { background: var(--status-online); box-shadow: 0 0 10px 2px rgba(16, 185, 129, 0.5); }
        #status-indicator.error { background: var(--status-error); box-shadow: 0 0 10px 2px rgba(239, 68, 68, 0.5); }

        .info-grid { display: grid; gap: 1.25rem; margin-bottom: 2rem;}
        .info-item {
            display: flex; align-items: center; gap: 1rem;
            background: #f9fafb; padding: 1rem; border-radius: 8px; border: 1px solid var(--border-color);
        }
        .info-item .icon { width: 24px; height: 24px; color: var(--accent-color); }
        .info-label { font-weight: 500; color: var(--text-secondary); }
        .info-value { font-weight: 600; color: var(--text-primary); margin-left: auto; font-size: 1.05rem; }

        /* --- Progress Bar & Button --- */
        .progress-bar-container { width: 100%; background: #e2e8f0; border-radius: 99px; height: 8px; overflow: hidden; margin-bottom: 1.5rem; }
        .progress-bar { height: 100%; background: var(--accent-color); transition: width .4s ease-in-out; }

        #track-button {
            background: var(--accent-color); color: #fff; padding: 0.875rem 1.5rem;
            border: none; border-radius: 8px; cursor: pointer; font-size: 1rem; font-weight: 600;
            width: 100%; margin-top: auto; box-shadow: var(--shadow);
            transition: all .2s ease;
            display: flex; align-items: center; justify-content: center; gap: 0.5rem;
        }
        #track-button:hover { background: var(--accent-color-dark); box-shadow: var(--shadow-lg); transform: translateY(-2px); }
        #track-button:active { transform: translateY(0); box-shadow: var(--shadow); }
        #track-button:disabled { background: #94a3b8; cursor: not-allowed; box-shadow: none; transform: translateY(0); }
        #track-button .icon { display: none; }
        #track-button.loading .icon { display: block; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* --- Map --- */
        #map { width: 100%; height: 100%; min-height: 600px; }

        /* --- Responsive Design --- */
        @media (max-width: 1200px) {
            .container { grid-template-columns: 320px 1fr; gap: 1.5rem; }
            body { padding: 1.5rem; }
        }
        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
                grid-template-areas:
                    "header"
                    "info-panel"
                    "map-panel";
            }
            #map { min-height: 500px; }
        }
        @media (max-width: 480px) {
            body { padding: 1rem; }
            .info-panel, .map-panel { padding: 1.5rem; }
            header h1 { font-size: 1.75rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Bảng điều khiển Gậy thông minh</h1>
        </header>

        <div class="info-panel">
            <h2>
                Thông tin thiết bị
                <div class="status-wrapper">
                    <span id="status-text">Ngoại tuyến</span>
                    <span id="status-indicator" title="Trạng thái dữ liệu"></span>
                    <span id="sync-status" style="font-size: 0.8rem; color: #6b7280;">🔄 Manual</span>
                </div>
            </h2>

            <div class="info-grid">
                <div class="info-item">
                    <svg class="icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
                    <span class="info-label">Vĩ độ</span>
                    <span id="latitude-value" class="info-value">Đang tải...</span>
                </div>
                <div class="info-item">
                     <svg class="icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
                    <span class="info-label">Kinh độ</span>
                    <span id="longitude-value" class="info-value">Đang tải...</span>
                </div>
                <div class="info-item">
                    <svg class="icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                    <span class="info-label">Cập nhật lúc</span>
                    <span id="time-value" class="info-value">--:--:--</span>
                </div>
                <div class="info-item">
                    <svg class="icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 1.5H8.25A2.25 2.25 0 006 3.75v16.5a2.25 2.25 0 002.25 2.25h7.5A2.25 2.25 0 0018 20.25V3.75a2.25 2.25 0 00-2.25-2.25H13.5m-3 0V3h3V1.5m-3 0h3m-3 18.75h3" /></svg>
                    <span class="info-label">Thiết bị</span>
                    <span id="deviceId" class="info-value">SmartCane01</span>
                </div>
            </div>

            <div class="progress-bar-container">
                <div id="data-progress-bar" class="progress-bar"></div>
            </div>

            <button id="track-button" onclick="fetchLocationDataManual()">
                <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
                <span class="btn-text">Lấy GPS Thực tế</span>
            </button>
        </div>

        <div class="map-panel">
            <div id="map"></div>
        </div>
    </div>

    <script>
        let map;
        let marker;
        const initialPosition = [10.7769, 106.7009]; 
        const deviceIdToTrack = 'SmartCane01';
        
        const ui = {
            statusIndicator: document.getElementById('status-indicator'),
            statusText: document.getElementById('status-text'),
            syncStatus: document.getElementById('sync-status'),
            progressBar: document.getElementById('data-progress-bar'),
            latValue: document.getElementById('latitude-value'),
            lonValue: document.getElementById('longitude-value'),
            timeValue: document.getElementById('time-value'),
            trackButton: document.getElementById('track-button'),
            btnText: document.querySelector('#track-button .btn-text')
        };

        function updateUI(data, isRealTime = false) {
            const lat = data.latitude;
            const lon = data.longitude;
            const newPosition = [lat, lon];
            const timestamp_utc = new Date(data.timestamp_server);

            if (isNaN(timestamp_utc.getTime())) {
                console.error("Timestamp không hợp lệ từ server:", data.timestamp_server);
                showErrorUI('Timestamp không hợp lệ');
                return;
            }

            const dateTimeString = new Intl.DateTimeFormat('vi-VN', {
                year: 'numeric', month: '2-digit', day: '2-digit',
                hour: '2-digit', minute: '2-digit', second: '2-digit',
                timeZone: 'Asia/Ho_Chi_Minh'
            }).format(timestamp_utc);

            // Cập nhật UI với dữ liệu thực từ ESP32
            ui.latValue.textContent = lat.toFixed(6);
            ui.lonValue.textContent = lon.toFixed(6);
            ui.timeValue.textContent = dateTimeString;
            ui.statusIndicator.className = 'online';
            
            // Hiển thị trạng thái khác nhau cho real-time vs stored data
            if (isRealTime) {
                ui.statusText.textContent = 'ESP32 GPS Thực tế';
                ui.statusIndicator.title = `GPS thực tế từ ESP32: ${dateTimeString}`;
                ui.syncStatus.textContent = '🕐 Real-time GPS';
                ui.syncStatus.style.color = '#059669';
                console.log(`🕐 Real-time GPS data: ${lat.toFixed(6)}, ${lon.toFixed(6)} at ${dateTimeString}`);
            } else {
                ui.statusText.textContent = 'ESP32 Trực tuyến';
                ui.statusIndicator.title = `Dữ liệu ESP32 đã lưu: ${dateTimeString}`;
                ui.syncStatus.textContent = '🔄 Auto Sync';
                ui.syncStatus.style.color = '#10b981';
            }

            // Popup với thông tin chi tiết
            const sourceText = isRealTime ? 'ESP32 Live GPS' : 'ESP32 Hardware GPS';
            const iconText = isRealTime ? '🕐' : '🚀';
            const popupContent = `
                <div style="text-align: center;">
                    <b>${iconText} ESP32 ${sourceText}</b><br>
                    <small>Cập nhật: ${dateTimeString}</small><br>
                    <strong>Lat: ${lat.toFixed(6)}</strong><br>
                    <strong>Lon: ${lon.toFixed(6)}</strong><br>
                    <small>📍 Source: ${data.source || sourceText}</small>
                </div>
            `;
            
            if (marker) {
                marker.setLatLng(newPosition).setPopupContent(popupContent).openPopup();
            } else {
                const markerColor = isRealTime ? '#059669' : '#10b981';
                const markerIcon = isRealTime ? '🕐' : '📡';
                marker = L.marker(newPosition, {
                    icon: L.divIcon({
                        html: `<div style="background: ${markerColor}; color: white; border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold;">${markerIcon}</div>`,
                        className: '',
                        iconSize: [20, 20],
                        iconAnchor: [10, 10]
                    })
                }).addTo(map).bindPopup(popupContent).openPopup();
            }

            // Cập nhật bản đồ
            if (map.getZoom() < 16 || !map.getBounds().contains(newPosition)) {
                map.setView(newPosition, 17); 
            } else {
                map.panTo(newPosition);
            }
            
            const logMsg = isRealTime ? 
                `🕐 Real-time GPS Updated: ${lat.toFixed(6)}, ${lon.toFixed(6)} at ${dateTimeString}` :
                `✅ ESP32 Data Updated: ${lat.toFixed(6)}, ${lon.toFixed(6)} at ${dateTimeString}`;
            console.log(logMsg);
        }
        
        function showErrorUI(message) {
             console.error('Lỗi khi lấy dữ liệu:', message);
             ui.latValue.textContent = 'N/A';
             ui.lonValue.textContent = 'N/A';
             ui.timeValue.textContent = 'N/A';
             ui.statusIndicator.className = 'error';
             ui.statusText.textContent = 'Lỗi kết nối';
             ui.statusIndicator.title = message;
             ui.syncStatus.textContent = '❌ Sync Error';
             ui.syncStatus.style.color = '#ef4444';
             if (ui.progressBar) ui.progressBar.style.width = '0%';
        }

        async function fetchLocationData(useRealTime = false) {
            if (ui.progressBar) ui.progressBar.style.width = '30%'; 
            ui.statusIndicator.className = ''; 
            ui.statusText.textContent = 'Đang tải ESP32...';
            ui.syncStatus.textContent = useRealTime ? '🔄 Real-time GPS...' : '🔄 Loading...';
            ui.syncStatus.style.color = '#f59e0b';
            
            try {
                let url;
                if (useRealTime) {
                    // Sử dụng endpoint mới để lấy dữ liệu GPS trực tiếp từ ESP32
                    url = `/api/get_real_gps?deviceId=${deviceIdToTrack}`;
                    console.log('🕐 Fetching REAL-TIME data from /api/get_real_gps...');
                } else {
                    // Sử dụng endpoint cũ để lấy dữ liệu đã lưu
                    url = `/api/get_latest_location?deviceId=${deviceIdToTrack}`;
                    console.log('📅 Fetching stored GPS data from database...');
                }
                
                const response = await fetch(url, { 
                    cache: 'no-store',
                    headers: {
                        'Cache-Control': 'no-cache',
                        'Pragma': 'no-cache'
                    }
                });
                if (ui.progressBar) ui.progressBar.style.width = '70%';

                if (!response.ok) {
                    throw new Error(`Lỗi HTTP! Status: ${response.status}`);
                }
                const data = await response.json(); 

                if (data && typeof data.latitude === 'number') {
                    // `useRealTime` được truyền vào để UI biết cách hiển thị
                    updateUI(data, useRealTime);
                    if (ui.progressBar) ui.progressBar.style.width = '100%';
                    const logMsg = useRealTime ? 
                        `🕐 Real-time GPS: ${data.latitude.toFixed(6)}, ${data.longitude.toFixed(6)} at ${data.time_local}` :
                        `📅 Stored data: ESP32 data loaded at ${new Date().toLocaleTimeString()}`;
                    console.log(logMsg);
                } else {
                    showErrorUI('Không nhận được dữ liệu ESP32 từ server');
                }
            } catch (error) { 
                console.error('❌ Fetch error:', error);
                showErrorUI(error.message);
            }
        }
        
        function fetchLocationDataManual() {
            const originalText = ui.btnText.textContent;
            ui.btnText.textContent = 'Đang lấy GPS thực tế...';
            ui.trackButton.classList.add('loading');
            ui.trackButton.disabled = true;
            if(ui.progressBar) ui.progressBar.style.width = '10%';

            // Sử dụng real-time GPS khi nhấn nút manual
            fetchLocationData(true).finally(() => {
                ui.btnText.textContent = originalText;
                ui.trackButton.disabled = false;
                ui.trackButton.classList.remove('loading');
            });
        }

        function initMap() {

            map = L.map('map', { zoomControl: false }).setView(initialPosition, 13);

            var osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
                maxZoom: 19,
            });

            var baseMaps = {
                "OpenStreetMap": osm,
            };

            L.control.layers(baseMaps).addTo(map);

            osm.addTo(map);

            L.control.zoom({ position: 'bottomright' }).addTo(map);

            // Custom marker icon
            const initialIcon = L.divIcon({
                html: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#ef4444" width="32" height="32"><path d="M12 2.25c-3.96 0-7.18 3.22-7.18 7.18 0 3.53 2.56 6.48 5.82 7.08.2.03.36.19.36.39v1.58c0 .28.22.5.5.5h1c.28 0 .5-.22.5-.5v-1.58c0-.2.16-.36.36-.39 3.26-.6 5.82-3.55 5.82-7.08C19.18 5.47 15.96 2.25 12 2.25z"/></svg>`,
                className: '',
                iconSize: [32, 32],
                iconAnchor: [16, 32],
                popupAnchor: [0, -32]
            });

            marker = L.marker(initialPosition, { icon: initialIcon }).addTo(map).bindPopup('Vị trí ban đầu của gậy.');

            fetchLocationData(); 
            setInterval(fetchLocationData, 30000);
        }

        document.addEventListener('DOMContentLoaded', initMap);
    </script>
</body>
</html>
